services:
  db:
    image: postgres:16
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=odoo17
      - POSTGRES_PASSWORD=odoo17
      - POSTGRES_DB=postgres
    restart: always             
    volumes:
        - postgres_data:/var/lib/postgresql/data

  odoo17:
    image: odoo:17
    depends_on:
      - db
    ports:
      - 8069:8069
      - 8072:8072
    tty: true
    command: --
    environment:
      - HOST=db
      - USER=odoo17
      - PASSWORD=odoo17
    volumes:
      - odoo:/etc/odoo
      - extra_addons:/mnt/extra-addons/
      - addons:/usr/lib/python3/dist-packages/odoo/addons
    restart: always             # run 

volumes:
  postgres_data:
    driver: local
    driver_opts:
        type: 'none'
        o: 'bind'
        device: './postgres_data'
  addons:
    driver: local
    driver_opts:
        type: 'none'
        o: 'bind'
        device: './addons'
  extra_addons:
    driver: local
    driver_opts:
        type: 'none'
        o: 'bind'
        device: './extra_addons'
  odoo:
    driver: local
    driver_opts:
        type: 'none'
        o: 'bind'
        device: './odoo'
