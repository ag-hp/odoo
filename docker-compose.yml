services:
  db:
    image: postgres:16
    container_name: db
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=odoo17
      - POSTGRES_PASSWORD=odoo17
    ports:
      - "5432:5432"
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    restart: always

  odoo17:
    image: odoo:17.0
    container_name: odoo17
    depends_on:
      - db
    ports:
      - "8069:8069"
      - "8072:8072"
    tty: true
    command: --
    environment:
      - HOST=db
      - USER=odoo17
      - PASSWORD=odoo17
    volumes:
      - odoo-data:/var/lib/odoo
      - ./odoo:/etc/odoo
      - ./extra_addons:/mnt/extra-addons
    restart: always

volumes:
  odoo-db-data:
  odoo-data:
